<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Task2.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Task-2</title>
  </head>
  <body>
    <div class="container">
      <!-- navbar start -->

      <nav>
        <i class="ri-menu-line"></i>

        <img src="./logo-removebg-preview.png" alt="" />

          <g
            id="light-dark-mode--light-dark-mode-setting-camera-picture-photo-image-brightness"
          >
            <path
              id="Union"
              fill="#000000"
              fill-rule="evenodd"

              clip-rule="evenodd"
              stroke-width="1"
            ></path>
          </g>
        </svg>
      </nav>

      <!-- navbar end -->

      <!-- search bar start -->

      <div class="searchContainer">
        <div id="search">
          <label for="searchIcon"><i class="ri-search-line"></i></label>
          <input type="text" placeholder="Search for a Pokémon..." />
        </div>

        <div id="searchRight">
          <div>
            <h5>Filter by types (1) <i class="ri-arrow-drop-down-line"></i></h5>
          </div>
          <i id="list" class="ri-menu-4-fill"></i>
        </div>
      </div>

      <!-- search bar end -->

      <!-- cards stats -->

      <div class="cards">
        <div id="card">
            <div id="box1">
                <img src="./pokimon1.png" alt="">
            </div>
            <div id="box2">
                <h5>Meowscarada</h5>
                <div id="box2Bottom">
                      <h5><i class="ri-leaf-fill"></i> Grass</h5> 
                      <h5><i class="ri-arrow-right-line"></i></h5>                
                </div>
            </div>
        </div>
        <div id="card">
            <div id="box1">
                <img src="./pokimon2.png" alt="">
            </div>
            <div id="box2">
                <h5>Pawniard</h5>
                <div id="box2Bottom">
                      <h5>DARK STEEL</h5> 
                      <h5><i class="ri-arrow-right-line"></i></h5>                
                </div>
            </div>
        </div>
        <div id="card">
            <div id="box1">
                <img src="./pokimon3.png" alt="">
            </div>
            <div id="box2">
                <h5>Houndoom</h5>
                <div id="box2Bottom">
                      <h5>DARK/FIRE</h5> 
                      <h5><i class="ri-arrow-right-line"></i></h5>                
                </div>
            </div>
        </div>
        <div id="card">
            <div id="box1">
                <img src="./pokimon4.png" alt="">
            </div>
            <div id="box2">
                <h5>Inkay</h5>
                <div id="box2Bottom">
                      <h5>DARK/PSYCHIC</h5> 
                      <h5><i class="ri-arrow-right-line"></i></h5>                
                </div>
            </div>
        </div>
        
      </div>


      <footer>
        <div class="footerBox">
            <div id="left"><i class="ri-focus-2-line"></i></div>
            <div id="right">
                <h6>Explore</h6>
                <p>Discover all your <br> favorite Pokémon</p>
            </div>
        </div>

        <div class="footerBox">
            <div id="left"><i class="ri-leaf-fill"></i></div>
            <div id="right">
                <h6>Filter</h6>
                <p>Find Pokémon by <br>types and abdities</p>
            </div>
        </div>

        <div class="footerBox">
            <div id="left">🌟</div>
            <div id="right">
                <h6>Collection</h6>
                <p>Save and manage <br>your collection</p>
            </div>
        </div>


        <div class="footerBox">
            <div id="left"><i class="ri-map-pin-user-fill"></i></div>
            <div id="right">
                <h6>Stats</h6>
                <p>View stats and learn <br>about Pokérnon</p>
            </div>
        </div>
      </footer>





    </div>
  </body>
</html>
